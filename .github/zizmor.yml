# kit's zizmor configuration.
#
# WHAT IS *NOT* IN HERE IS THE POINT
#
#   `unpinned-uses` has no entry in this file, and there is a check in
#   tests/validate.sh that fails if one appears.
#
#   zizmor would let the fleet suppress it here, in a file that looks like
#   routine housekeeping, and every `uses:` in every adopting repo would go
#   quiet. The trade it is suppressing is real — pinning thirteen repositories
#   to SHAs and owning the bump is not free, and not pinning means a change to
#   kit's workflow lands in six services' CI without review — but suppressing
#   it there would be making that trade invisibly, which is the one thing a
#   decision log exists to prevent.
#
#   So it is recorded instead. `tests/zizmor_gate.sh` counts every
#   `unpinned-uses` finding, prints the count and the reason on every run, and
#   fails on everything else. The finding is still measured, still visible, and
#   still waiting on a decision. See DECISIONS.md under MD10.
#
# WHAT IS IN HERE
#   One entry: `self-repository`.
#
#   zizmor wants `uses: $/...` rather than `uses: ./...` for a same-repository
#   reference. GitHub shipped that form in July 2026 and it is a genuine
#   improvement — the self-repository form is not resolved against the runtime
#   filesystem, so a step cannot clone an action over the top of one, and
#   GitHub itself treats it as a form of pinning.
#
#   It is not adopted here, and the reason is a boundary rather than a
#   disagreement: kit's ENTIRE documented contract is the `./` form. AGENTS.md,
#   README.md, the `callable path` check in tests/validate.sh and four of the
#   eighteen self_test breakages all assert on that exact string, and changing
#   the spelling means rewriting all of them plus the sentence in ci.yml that
#   explains why kit calls itself. That is the callable-path packet's change to
#   make, on a commit that can verify it in GitHub's own runner. This packet
#   cannot: a change to the one job that proves kit's standard resolves is
#   exactly the kind of change that must not be made and asserted green from a
#   laptop.
#
#   Two things make deferring this safe rather than lazy. It is a single
#   finding on a single line in one file, it is written down here with the
#   cost, and the alternative is recorded in the same comment: the alternative
#   is not "pin it", it is "change the spelling, and make the caller_check and
#   four self_test breakages agree". Nothing here is allowed to grow.

rules:
  self-repository:
    ignore:
      # Recorded, not fixed — see the note above. One line, one file, one
      # finding, deferred to the packet that owns the documented `uses:` string.
      # An entry added here without a reason below fails tests/validate.sh.
      - ci.yml:48:11
