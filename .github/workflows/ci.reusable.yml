---
# kit — the CI path every cafaye service repo runs.
#
# Consumers do not copy this file; they call it (repo: github.com/cafaye/<svc>):
#
#   # .github/workflows/ci.yml
#   name: ci
#   on: [push, pull_request]
#   permissions:
#     contents: read
#   jobs:
#     ci:
#       uses: cafaye/kit/.github/workflows/ci.reusable.yml@master
#       with:
#         language: go
#         working-dir: .
#
# The `.github/workflows/` in that path is not decoration. GitHub resolves a
# reusable workflow at `{owner}/{repo}/.github/workflows/{file}@{ref}` and
# documents that subdirectories of the workflows directory are not supported, so
# this file has no reachable path from anywhere else in the tree. It is also the
# only place a workflow may live at all if the repository that defines it is to
# call it with `uses: ./.github/workflows/ci.reusable.yml`.
#
# One job per language exists on purpose: six services, six toolchains, and a
# `language` x `version` matrix would multiply CI minutes the org cannot spend.
# Every job is gated on `inputs.language`, so exactly one runs per call.
#
# STRICTNESS NOTES (read before loosening anything)
#   - No job builds or pushes an image, and no job writes to the default branch.
#     Release work is a separate workflow so a red test can never publish.
#   - The coverage gate is a PLACEHOLDER (0) so adoption never blocks a repo on
#     day one, and it is an INPUT (coverage-fail-under) so a repo raises it in
#     its caller rather than forking this file. A gate left at 0 fails nothing.
#   - Action refs are floating major tags where the upstream publishes them and
#     exact tags where it does not (astral-sh/*). Dependabot upgrades are
#     one-line diffs; full-SHA pinning is a service repo's own choice.
#   - Every step that can run offline does. Nothing here reaches a cafaye
#     service, so this workflow needs no secrets.
name: ci
on:
  workflow_call:
    inputs:
      language:
        description: >-
          Toolchain to build, lint, and test. One job runs; the rest skip. Use
          'none' for a repository with no service manifest at all.
        required: true
        type: string
        options:
          - go
          - ruby
          - elixir
          - python
          - node
          - bun
          - rust
          - none
      # The kit ref the LINT CONFIGS are read from, as opposed to the ref this
      # workflow file itself was fetched at.
      #
      # These are two different things and the difference is the whole reason
      # this input exists. `uses: cafaye/kit/.github/workflows/ci.reusable.yml@X`
      # pins the WORKFLOW at X. GitHub does not hand a called workflow its own
      # ref — `github.workflow_ref` inside a reusable workflow is the CALLER's
      # workflow, and `GITHUB_ACTION_PATH` is documented as composite-action-only
      # — so the configs have to be fetched by a name, and the name has to be an
      # input. Defaulting it to `master` matches every caller in the fleet,
      # which is written `uses: cafaye/kit/...@master`.
      #
      # Raise it to a SHA when you pin the `uses:` line to one. It is NOT a
      # second, independent pin: a caller who pins the workflow to a SHA and
      # leaves this at `master` gets that SHA's workflow with today's lint
      # policy, which is a real and specific failure. Nothing detects it
      # automatically, so it is documented here and in README.md rather than
      # pretended to be automatic.
      kit-lint-ref:
        description: >-
          Git ref to read kit's lint configs from, e.g. 'master' or a commit
          SHA. Pin it to the SAME ref you pinned the `uses:` line to. Changing
          it changes a service's lint policy without touching the service.
        required: false
        type: string
        default: 'master'
      # Extra arguments appended to the linter's own command line, after kit's.
      #
      # THIS IS THE DEVIATION SEAM, and its narrowness is the point:
      #
      #   - It comes LAST, so a service can add flags (`-E gosec`) and cannot
      #     remove the `--config` that precedes it. Anything appended here is an
      #     addition to kit's invocation, not a replacement of it.
      #   - It is a string, not a path, so there is no service-side config file
      #     for a linter to read and therefore none to rot. The failure this
      #     packet ends is a file nobody propagates; a seam that reintroduces
      #     the file reinstates the failure.
      #   - It may not be used to turn kit's config off. `--no-config` here
      #     would restore the linter's defaults, and `lint_wiring_check` in
      #     tests/validate.sh fails on exactly that string.
      #
      # What it is FOR: a repository that needs a stricter setting than the
      # fleet's, and nothing else. If a flag is wanted often enough to be
      # common, it belongs in lint/ and every service gets it for free.
      lint-args:
        description: >-
          Extra arguments appended to the linter's command line, after kit's
          own flags. For a service that needs a stricter setting than the
          fleet's. May not disable kit's config; a value here is a place a
          per-service lint policy can rot, so prefer a change in kit.
        required: false
        type: string
        default: ''
      # Descriptions are folded, not quoted: a long description that is reflowed
      # to fit line-length is unreadable, and Actions has no width limit on
      # `description`. Our own lint/yamllint.yml caps source lines at 120.
      working-dir:
        description: >-
          Directory holding the service manifest: go.mod, Gemfile, mix.exs,
          pyproject.toml, package.json, or Cargo.toml.
        required: false
        type: string
        default: '.'
      versions:
        description: >-
          Optional JSON toolchain pin, e.g. {"go":"1.24.1","python":"3.13"}.
          Unset keys use the toolchain default.
        required: false
        type: string
        default: '{}'
      coverage-fail-under:
        description: >-
          Minimum coverage percent, 0-100. Defaults to 0 so adoption never
          blocks a repo on day one; raise it in your caller. A gate that can
          never fail is not a gate, so do not leave this at 0.
        required: false
        type: string
        default: '0'
      # The tier a service DEMANDS, by gate-variable name: `REQUIRED_DB`, not
      # `db`. Demanded rather than inferred, on purpose.
      #
      # Inference is the failure this replaces. Identity derives its database
      # tier by grepping the tree for `dbtest.Pool|Schema|EnvVar|TEST_DATABASE_URL`,
      # and that fails OPEN: a test that reaches Postgres through a helper two
      # files away, or through a fixture, does not match, so its package never
      # enters the required list and the run is never required to contain it.
      # The test is written. It is not gated. Nobody finds out.
      #
      # So the caller NAMES the variable and this workflow exports it as `1` on
      # the test step of every language job, which is guard's
      # GUARD_REDIS_REQUIRED pattern: it fails at tier-invocation time, before a
      # report exists, so nothing downstream can misreport the run.
      #
      # Setting it commits the repo to the normalised result format
      # (templates/tier/README.md): the `tier demand` step below reads a `ran`
      # line out of the run log and fails NAMING THIS VARIABLE when the tier ran
      # zero tests. A gate variable that is set, and a tier that ran nothing, is
      # a green build that verified nothing.
      #
      # A string, empty by default. Adoption cannot turn a green repo red,
      # because an unset variable demands nothing and the `tier demand` step
      # exits 0 without reading a log.
      required-tier:
        description: >-
          Gate variable that demands a tier, e.g. 'REQUIRED_DB'. Exported as
          '1' on the test step, and a tier that then runs zero tests fails the
          build naming this variable. Empty (the default) demands nothing.
          Adopting this also commits the repo to the normalised result format.
        required: false
        type: string
        default: ''
      # Opt-in by construction. A kit change that breaks every consumer's CI is
      # a kit change that does not ship, so a new job cannot start running in
      # 13 repos the day it lands — the repo has to ask for it by name.
      #
      # A string, not a boolean: `inputs.telemetry == 'true'` reads the way a
      # caller writes it, and GitHub coerces the bare word `false` to a boolean
      # in some positions, which makes `if: inputs.telemetry` a trap. Compare
      # to the string and there is no coercion to reason about.
      telemetry:
        description: >-
          'Run the W3C traceparent conformance job as well: "true" or "false".
          Off by default so adopting kit never turns a green repo red. Turn it
          on in a repo that has copied templates/otel/<lang>/ into its tree.'
        required: false
        type: string
        default: 'false'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder (0) so adoption never blocks a repo on day one. A service repo
  # raises it with the `coverage-fail-under` input — a value, not a fork of this
  # file. Set in env so all six jobs read one number.
  COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
  # Deterministic builds: do not stamp VCS info into Go binaries.
  GOFLAGS: '-buildvcs=false'
  # The demanded gate variable's NAME, not its value. It is exported as `1` on
  # each test step rather than set here, because an env block cannot have a key
  # that is a variable — and setting it here would export it to every step in
  # the job, including the ones that are not running the tier.
  REQUIRED_TIER: ${{ inputs.required-tier }}
  # Where kit's own tree lands inside the service being built. `.kit` and NOT
  # a path beside the repository, and the reason is measured rather than
  # stylistic: ESLint's flat config is an ES module that does
  # `import js from '@eslint/js'`, and node resolves that import from the
  # CONFIG FILE's own directory upward. A config sitting beside the repository
  # finds no `@eslint/js` and the run dies with ERR_MODULE_NOT_FOUND — a red
  # build that has linted nothing. Inside the tree it walks up into the
  # service's own node_modules and resolves. golangci-lint and rubocop accept
  # the same path happily, so one location serves all three.
  KIT_LINT_DIR: ${{ inputs.working-dir }}/.kit
  # The linter's own extra arguments, from the seam. Empty by default, which is
  # the fleet's current state: every service lints with kit's policy and
  # nothing else.
  KIT_LINT_ARGS: ${{ inputs.lint-args }}

# ===========================================================================
# THE `tier demand` STEP — one body, present in every language job, IDENTICAL
# in all of them.
#
# GitHub reusable workflows have no way to share a step, so this block is
# duplicated. That is a deliberate trade: kit's rule is that callers override
# and never fork, and six hand-maintained copies of a policy block is exactly
# the drift that rule exists to prevent — so the copies are not left to drift.
# `tier_demand_check` in tests/validate.sh asserts the step exists in every
# language job AND that all six bodies are byte-identical. Change one, change
# all six, or the gate goes red.
# ===========================================================================

jobs:
  # ----------------------------------------------------- configuration-only
  # `language: none` — a repository with no service manifest. No go.mod, no
  # Gemfile, no pyproject.toml: the seven jobs above each open with a manifest
  # they cannot find, and a caller passing one of them gets a red build on a
  # repository that has nothing to compile.
  #
  # It exists because of that, and because of a second, sharper reason: this is
  # kit, and the repository that defines the standard should be the first
  # repository held to it. Without it kit could not call its own workflow at
  # all — `uses: ./.github/workflows/ci.reusable.yml` still needs a `language`,
  # `language` is required, and every value in `options` named a toolchain this
  # repository does not have. The repository that ships the standard was
  # structurally excluded from using it.
  #
  # It runs the repository's own gate, `tests/validate.sh`, and FAILS when that
  # file is absent. A caller who asks for the configuration gate and ships no
  # gate has asked for a green checkmark on nothing, which is the same defect
  # as a coverage threshold left at 0. Deliberately strict, and the failure
  # message says which file is missing.
  none:
    name: none
    if: ${{ inputs.language == 'none' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kit gate
        working-directory: ${{ inputs.working-dir }}
        # The gate bootstraps its own dependencies (PyYAML, yamllint, hadolint)
        # into a gitignored .venv/, so a runner with nothing installed runs
        # the same command a developer runs on a fresh clone. See the header of
        # tests/validate.sh.
        run: |
          set -euo pipefail
          if [ ! -f tests/validate.sh ]; then
            echo "::error::language 'none' runs this repository's own gate, and"
            echo "::error::tests/validate.sh does not exist. Either ship the gate,"
            echo "::error::or pass a real language."
            exit 1
          fi
          bash tests/validate.sh

  # ------------------------------------------------------------- compiled
  go:
    name: go
    if: ${{ inputs.language == 'go' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ fromJSON(inputs.versions).go || 'stable' }}
          cache-dependency-path: ${{ inputs.working-dir }}/go.sum
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: go mod download
      - name: build
        working-directory: ${{ inputs.working-dir }}
        run: go build ./...
      # Kit's own tree, INSIDE the service, for the lint config below. Sparse,
      # because the only thing read out of it is `lint/` and a full clone of
      # kit on every Go push is a cost paid for files nobody opens.
      #
      # `persist-credentials: false` so kit's checkout leaves no token in a
      # git config inside the tree a service's own later steps run in.
      - name: kit (lint config)
        uses: actions/checkout@v7
        with:
          repository: cafaye/kit
          ref: ${{ inputs.kit-lint-ref }}
          path: ${{ env.KIT_LINT_DIR }}
          sparse-checkout: lint
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ inputs.working-dir }}
          # `--config` and not `GOLANGCI_LINT_CONFIG`: measured on
          # golangci-lint v2.6.2, the environment variable is read by NOTHING —
          # the run proceeds on the built-in default set and exits 0 on a file
          # this config rejects. So the missing flag is not a slower lint, it
          # is a different and much weaker policy that still goes green.
          #
          # `args` is space-split by the action, so the flag carries an `=`.
          args: --config=${{ github.workspace }}/${{ env.KIT_LINT_DIR }}/lint/golangci.yml ${{ env.KIT_LINT_ARGS }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred. guard's
          # GUARD_REDIS_REQUIRED pattern: it turns "no database" from a skip
          # into a failure at INVOCATION time, before a report exists, so
          # nothing downstream can summarise the run as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          # -count=1 is mandated, not a suggestion. Go keys its test cache on
          # the environment variables a test reads, so a gated and an ungated
          # run already have different cache keys — genuinely good news — but
          # mandating -count=1 removes the question instead of reasoning about
          # it, and it costs nothing.
          go test -race -count=1 -coverprofile=coverage.out ./... 2>&1 \
            | tee "$RUNNER_TEMP/kit-tier.log"
          # `pipefail` is on, so this step already exits with go test's status.
          # Stated because without it a piped exit code is the exit of the LAST
          # command — tee — and a test step that reports tee's status is a gate
          # that can never fail.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: |
          go tool cover -func=coverage.out |
            awk -v min="$COVERAGE_FAIL_UNDER" '
              /total:/ { gsub(/%/, "", $3); if ($3 + 0 < min + 0) { print "coverage " $3 "% < " min "%"; bad = 1 } }
              END { exit bad }
            '
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-go
          path: ${{ inputs.working-dir }}/coverage.out
          if-no-files-found: ignore

  rust:
    name: rust
    if: ${{ inputs.language == 'rust' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: cargo fetch
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred: a tier that cannot run
          # must fail here, at invocation time, rather than report as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          cargo test 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          # `pipefail` is on, so this step already exits with cargo's status.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      - name: install coverage tool
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: cargo llvm-cov --fail-under-lines "$COVERAGE_FAIL_UNDER"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-rust
          path: ${{ inputs.working-dir }}/coverage.out
          if-no-files-found: ignore

  # -------------------------------------------------------- interpreted
  ruby:
    name: ruby
    if: ${{ inputs.language == 'ruby' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads .ruby-version/.tool-versions/mise.toml from working-dir when the
      # repo pins one, so the worktree and CI agree on the interpreter.
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ${{ inputs.working-dir }}
          bundler-cache: true
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: bundle install
      # Kit's own tree, inside the service, for the lint config below. Same
      # step, same reason, same shape as the go job's — three jobs cannot share
      # a step in a reusable workflow, and `lint_wiring_check` is what keeps the
      # three copies from drifting.
      - name: kit (lint config)
        uses: actions/checkout@v7
        with:
          repository: cafaye/kit
          ref: ${{ inputs.kit-lint-ref }}
          path: ${{ env.KIT_LINT_DIR }}
          sparse-checkout: lint
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # `--config` is load-bearing, and the measurement is in tests/lint_test.sh:
      # with no config, RuboCop applies its own defaults and a 13-line method is
      # RED under those defaults and GREEN under kit's (Max: 15). A repo whose
      # lint step lost this flag goes from kit's policy to RuboCop's without
      # failing anything.
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: bundle exec rubocop --parallel --config "$KIT_LINT_DIR/lint/rubocop.yml" ${{ env.KIT_LINT_ARGS }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred: a tier that cannot run
          # must fail here, at invocation time, rather than report as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          bundle exec rake 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          # `pipefail` is on, so this step already exits with rake's status.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      # The repo's own `rake coverage` task reads COVERAGE_FAIL_UNDER and exits
      # nonzero below it (see README: a coverage rake task is part of adoption).
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: bundle exec rake coverage
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-ruby
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  elixir:
    name: elixir
    if: ${{ inputs.language == 'elixir' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(inputs.versions).elixir || '1.18' }}
          otp-version: ${{ fromJSON(inputs.versions).erlang || '27' }}
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: mix deps.get
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: mix format --check-formatted
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred: a tier that cannot run
          # must fail here, at invocation time, rather than report as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          mix test 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          # `pipefail` is on, so this step already exits with mix's status.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      # coveralls is a hex dep the service repo declares; it exits nonzero
      # below the minimum, which is what makes this a gate and not a report.
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: mix coveralls --minimum-coverage "$COVERAGE_FAIL_UNDER"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-elixir
          path: ${{ inputs.working-dir }}/cover
          if-no-files-found: ignore

  python:
    name: python
    if: ${{ inputs.language == 'python' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: ${{ inputs.working-dir }}
          enable-cache: true
      # Only for the documented no-uv fallback; uv does not need it.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ fromJSON(inputs.versions).python || '3.13' }}
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: |
          if command -v uv >/dev/null 2>&1; then uv sync --frozen; else pip install -e '.[dev]'; fi
      - name: lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: ${{ inputs.working-dir }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred: a tier that cannot run
          # must fail here, at invocation time, rather than report as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          if command -v uv >/dev/null 2>&1; then
            uv run pytest --cov --cov-report=xml 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          else
            pytest --cov --cov-report=xml 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          fi
          # `pipefail` is on, so this step already exits with pytest's status.
          # The PIPESTATUS index is 0 either way, because both arms are a
          # pipeline and the `if` does not reset it.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: |
          if command -v uv >/dev/null 2>&1; then uv run coverage report --fail-under="$COVERAGE_FAIL_UNDER"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-python
          path: ${{ inputs.working-dir }}/coverage.xml
          if-no-files-found: ignore

  node:
    name: node
    if: ${{ inputs.language == 'node' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(inputs.versions).node || '22' }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-dir }}/package-lock.json
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: npm ci
      # Kit's own tree, inside the service, for the lint config below. Same
      # step, same reason, same shape as the go and ruby jobs'.
      #
      # INSIDE the tree is not a preference here, it is the only thing that
      # works: kit's flat config does `import js from '@eslint/js'`, node
      # resolves that from the CONFIG FILE's directory upward, and a config
      # beside the repository finds nothing and dies with ERR_MODULE_NOT_FOUND.
      # Measured; see tests/lint_test.sh and README.md.
      - name: kit (lint config)
        uses: actions/checkout@v7
        with:
          repository: cafaye/kit
          ref: ${{ inputs.kit-lint-ref }}
          path: ${{ env.KIT_LINT_DIR }}
          sparse-checkout: lint
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # ESLint run DIRECTLY, not `npm run lint`.
      #
      # `npm run lint` is not a linter: it is whatever script the repository
      # happens to define, and a repository that defines none gets a confusing
      # "Missing script" rather than a lint, while one that defines it is
      # running its OWN config — which is the copy this packet exists to end.
      # Naming the tool is what makes the policy kit's.
      #
      # `npx --no-install` and not bare `npx`: without it, a service that has
      # not declared eslint gets a package FETCHED AND RUN at whatever version
      # is current, which is a floating dependency in a build that is otherwise
      # pinned. With it, a missing eslint is a build failure that says so.
      #
      # `.` rather than a path, so the service lints the same tree it tests.
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: npx --no-install eslint --config "$KIT_LINT_DIR/lint/eslint.config.mjs" . ${{ env.KIT_LINT_ARGS }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred: a tier that cannot run
          # must fail here, at invocation time, rather than report as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          npm test 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          # `pipefail` is on, so this step already exits with npm's status.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      # --if-present keeps day-one adoption green; drop it once the script exists
      # so a missing coverage step fails the build.
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: npm run coverage --if-present
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-node
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  # ------------------------------------------------------------------- bun
  # The job guard's own CI hand-rolled, because kit had none. guard ships
  # bun.lock and no package-lock.json, so the `node` job above would have died
  # on `npm ci` on day one and the whole file would have stayed bespoke.
  #
  # It is a separate job rather than a flag on the node one because the two
  # differ in ways a flag hides: a different package manager, a different
  # lockfile name, and a different frozen-install contract.
  bun:
    name: bun
    if: ${{ inputs.language == 'bun' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ fromJSON(inputs.versions).bun || '1.3.12' }}
      - name: install
        working-directory: ${{ inputs.working-dir }}
        # Frozen: installs exactly bun.lock and FAILS when the lock and the
        # manifest disagree. Plain `bun install` here would let a lockfile drift
        # reach master unnoticed, which is the entire reason the lockfile exists.
        run: bun install --frozen-lockfile
      - name: typecheck
        # `tsc --noEmit`. --noEmit matters: without it this step publishes
        # .js files next to the .ts sources, and the next step then tests files
        # the compiler invented rather than the ones in the commit.
        working-directory: ${{ inputs.working-dir }}
        run: bun run typecheck
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # The demand, exported rather than inferred: a tier that cannot run
          # must fail here, at invocation time, rather than report as a pass.
          if [ -n "${REQUIRED_TIER:-}" ]; then export "$REQUIRED_TIER=1"; fi
          bun test 2>&1 | tee "$RUNNER_TEMP/kit-tier.log"
          # `pipefail` is on, so this step already exits with bun's status.
          exit "${PIPESTATUS[0]}"
      - name: tier demand
        working-directory: ${{ inputs.working-dir }}
        run: |
          set -euo pipefail
          # An empty REQUIRED_TIER is the default and demands nothing, so a repo
          # that has not adopted tiers is untouched. Exits before reading a log
          # that need not exist.
          [ -n "${REQUIRED_TIER:-}" ] || exit 0
          log="$RUNNER_TEMP/kit-tier.log"
          if [ ! -f "$log" ]; then
            echo "::error::$REQUIRED_TIER was set and there is no run log at $log." >&2
            echo "::error::A demanded tier with no log is a green build that" >&2
            echo "::error::verified nothing, whatever the test step printed." >&2
            exit 1
          fi
          # The one place the normalised format is read, and it reads only the
          # format kit owns — never a per-language report. A `ran` line is the
          # evidence that something executed; no `ran` line is a tier that ran
          # zero tests, and the failure NAMES THE VARIABLE so the fix is obvious
          # from the log alone.
          if ! grep -qE '^ran[[:space:]]' "$log"; then
            echo "::error::$REQUIRED_TIER was set and no 'ran <tier> <suite> <test>'" >&2
            echo "::error::line reached this log. A gate variable that is set and a" >&2
            echo "::error::tier that ran zero tests is a green build that verified" >&2
            echo "::error::nothing. See templates/tier/README.md." >&2
            exit 1
          fi
      # --if-present for the same reason as the node job above: day-one adoption
      # must not be blocked by a coverage script that does not exist yet. Drop
      # it once `coverage` is in package.json, or this step is a report.
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: bun run --if-present coverage
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-bun
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  # ----------------------------------------------------------------- telemetry
  # Opt-in (see the `telemetry` input). A repo that has copied
  # templates/otel/<lang>/ into its tree runs the W3C traceparent conformance
  # suite for its language on every push, so "we propagate traces" stops being a
  # claim in a README and becomes a red build.
  #
  # A matrix, not six jobs: this is the one place a matrix is right. It runs
  # only when a repo opts in, it is a small stdlib-only suite, and a per-language
  # job here would mean six near-identical blocks to keep in sync. The six
  # language jobs above stay ungated-by-matrix because each one installs a
  # different toolchain, which is the thing a matrix cannot share.
  telemetry:
    name: telemetry (${{ matrix.language }})
    if: ${{ inputs.telemetry == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # One language at a time. Six runners for six stdlib suites costs more
      # than it returns, and a failure is easier to read from a serial log.
      max-parallel: 2
      fail-fast: false
      matrix:
        language:
          - go
          - ruby
          - elixir
          - python
          - node
          - rust
    steps:
      - uses: actions/checkout@v7
      # The toolchain comes from the matrix, so a bun-only repo does not install
      # an entire Go toolchain to run one test file. Each entry is the setup
      # action the language's own job uses, deliberately the same action and the
      # same version default, so the two paths cannot drift.
      - name: install go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ fromJSON(inputs.versions).go || 'stable' }}
      - name: install ruby
        if: ${{ matrix.language == 'ruby' }}
        uses: ruby/setup-ruby@v1
      - name: install elixir
        if: ${{ matrix.language == 'elixir' }}
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(inputs.versions).elixir || '1.18' }}
          otp-version: ${{ fromJSON(inputs.versions).erlang || '27' }}
      - name: install python
        if: ${{ matrix.language == 'python' }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ fromJSON(inputs.versions).python || '3.13' }}
      - name: install node
        if: ${{ matrix.language == 'node' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(inputs.versions).node || '22' }}
      - name: install rust
        if: ${{ matrix.language == 'rust' }}
        uses: dtolnay/rust-toolchain@stable
      - name: conformance suite
        # The suite the repo copied, not the one in kit: a service that has
        # patched its own middleware runs its own tests. Falls back to kit's
        # copy when the repo has not adopted the template yet, so turning the
        # input on is never a red build for want of a file.
        working-directory: ${{ inputs.working-dir }}
        env:
          KIT_TELEMETRY_DIR: ${{ inputs.working-dir }}/templates/otel/${{ matrix.language }}
        run: |
          set -euo pipefail
          dir="$KIT_TELEMETRY_DIR"
          if [ ! -d "$dir" ]; then
            echo "::notice::no $dir in this repo; running kit's own copy of the suite"
            dir="${GITHUB_ACTION_PATH}/templates/otel/${KIT_TELEMETRY_LANG:-${{ matrix.language }}}"
          fi
          case "${{ matrix.language }}" in
            go)
              GOFLAGS=-mod=mod GOPROXY=off GOTOOLCHAIN=local go test "$dir/..." ;;
            ruby)
              ruby "$dir/test_traceparent.rb" ;;
            elixir)
              elixir -r "$dir/traceparent.ex" "$dir/test_traceparent.exs" ;;
            python)
              python3 "$dir/test_traceparent.py" ;;
            node)
              node --test "$dir/traceparent.test.mjs" ;;
            rust)
              rustc --test --edition 2021 -o "$RUNNER_TEMP/kit-telemetry" "$dir/traceparent.rs"
              "$RUNNER_TEMP/kit-telemetry" ;;
          esac
