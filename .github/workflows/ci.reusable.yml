---
# kit — the CI path every cafaye service repo runs.
#
# Consumers do not copy this file; they call it (repo: github.com/cafaye/<svc>):
#
#   # .github/workflows/ci.yml
#   name: ci
#   on: [push, pull_request]
#   permissions:
#     contents: read
#   jobs:
#     ci:
#       uses: cafaye/kit/.github/workflows/ci.reusable.yml@master
#       with:
#         language: go
#         working-dir: .
#
# The `.github/workflows/` in that path is not decoration. GitHub resolves a
# reusable workflow at `{owner}/{repo}/.github/workflows/{file}@{ref}` and
# documents that subdirectories of the workflows directory are not supported, so
# this file has no reachable path from anywhere else in the tree. It is also the
# only place a workflow may live at all if the repository that defines it is to
# call it with `uses: ./.github/workflows/ci.reusable.yml`.
#
# One job per language exists on purpose: six services, six toolchains, and a
# `language` x `version` matrix would multiply CI minutes the org cannot spend.
# Every job is gated on `inputs.language`, so exactly one runs per call.
#
# STRICTNESS NOTES (read before loosening anything)
#   - No job builds or pushes an image, and no job writes to the default branch.
#     Release work is a separate workflow so a red test can never publish.
#   - The coverage gate is a PLACEHOLDER (0) so adoption never blocks a repo on
#     day one, and it is an INPUT (coverage-fail-under) so a repo raises it in
#     its caller rather than forking this file. A gate left at 0 fails nothing.
#   - Action refs are floating major tags where the upstream publishes them and
#     exact tags where it does not (astral-sh/*). Dependabot upgrades are
#     one-line diffs; full-SHA pinning is a service repo's own choice.
#   - Every step that can run offline does. Nothing here reaches a cafaye
#     service, so this workflow needs no secrets.
name: ci
on:
  workflow_call:
    inputs:
      language:
        description: >-
          Toolchain to build, lint, and test. One job runs; the rest skip. Use
          'none' for a repository with no service manifest at all.
        required: true
        type: string
        options:
          - go
          - ruby
          - elixir
          - python
          - node
          - bun
          - rust
          - none
      # Descriptions are folded, not quoted: a long description that is reflowed
      # to fit line-length is unreadable, and Actions has no width limit on
      # `description`. Our own lint/yamllint.yml caps source lines at 120.
      working-dir:
        description: >-
          Directory holding the service manifest: go.mod, Gemfile, mix.exs,
          pyproject.toml, package.json, or Cargo.toml.
        required: false
        type: string
        default: '.'
      versions:
        description: >-
          Optional JSON toolchain pin, e.g. {"go":"1.24.1","python":"3.13"}.
          Unset keys use the toolchain default.
        required: false
        type: string
        default: '{}'
      coverage-fail-under:
        description: >-
          Minimum coverage percent, 0-100. Defaults to 0 so adoption never
          blocks a repo on day one; raise it in your caller. A gate that can
          never fail is not a gate, so do not leave this at 0.
        required: false
        type: string
        default: '0'
      # Opt-in by construction. A kit change that breaks every consumer's CI is
      # a kit change that does not ship, so a new job cannot start running in
      # 13 repos the day it lands — the repo has to ask for it by name.
      #
      # A string, not a boolean: `inputs.telemetry == 'true'` reads the way a
      # caller writes it, and GitHub coerces the bare word `false` to a boolean
      # in some positions, which makes `if: inputs.telemetry` a trap. Compare
      # to the string and there is no coercion to reason about.
      telemetry:
        description: >-
          'Run the W3C traceparent conformance job as well: "true" or "false".
          Off by default so adopting kit never turns a green repo red. Turn it
          on in a repo that has copied templates/otel/<lang>/ into its tree.'
        required: false
        type: string
        default: 'false'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder (0) so adoption never blocks a repo on day one. A service repo
  # raises it with the `coverage-fail-under` input — a value, not a fork of this
  # file. Set in env so all six jobs read one number.
  COVERAGE_FAIL_UNDER: ${{ inputs.coverage-fail-under }}
  # Deterministic builds: do not stamp VCS info into Go binaries.
  GOFLAGS: '-buildvcs=false'

jobs:
  # ----------------------------------------------------- configuration-only
  # `language: none` — a repository with no service manifest. No go.mod, no
  # Gemfile, no pyproject.toml: the seven jobs above each open with a manifest
  # they cannot find, and a caller passing one of them gets a red build on a
  # repository that has nothing to compile.
  #
  # It exists because of that, and because of a second, sharper reason: this is
  # kit, and the repository that defines the standard should be the first
  # repository held to it. Without it kit could not call its own workflow at
  # all — `uses: ./.github/workflows/ci.reusable.yml` still needs a `language`,
  # `language` is required, and every value in `options` named a toolchain this
  # repository does not have. The repository that ships the standard was
  # structurally excluded from using it.
  #
  # It runs the repository's own gate, `tests/validate.sh`, and FAILS when that
  # file is absent. A caller who asks for the configuration gate and ships no
  # gate has asked for a green checkmark on nothing, which is the same defect
  # as a coverage threshold left at 0. Deliberately strict, and the failure
  # message says which file is missing.
  none:
    name: none
    if: ${{ inputs.language == 'none' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kit gate
        working-directory: ${{ inputs.working-dir }}
        # The gate bootstraps its own dependencies (PyYAML, yamllint, hadolint)
        # into a gitignored .venv/, so a runner with nothing installed runs
        # the same command a developer runs on a fresh clone. See the header of
        # tests/validate.sh.
        run: |
          set -euo pipefail
          if [ ! -f tests/validate.sh ]; then
            echo "::error::language 'none' runs this repository's own gate, and"
            echo "::error::tests/validate.sh does not exist. Either ship the gate,"
            echo "::error::or pass a real language."
            exit 1
          fi
          bash tests/validate.sh

  # ------------------------------------------------------------- compiled
  go:
    name: go
    if: ${{ inputs.language == 'go' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ fromJSON(inputs.versions).go || 'stable' }}
          cache-dependency-path: ${{ inputs.working-dir }}/go.sum
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: go mod download
      - name: build
        working-directory: ${{ inputs.working-dir }}
        run: go build ./...
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ inputs.working-dir }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: go test -race -coverprofile=coverage.out ./...
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: |
          go tool cover -func=coverage.out |
            awk -v min="$COVERAGE_FAIL_UNDER" '
              /total:/ { gsub(/%/, "", $3); if ($3 + 0 < min + 0) { print "coverage " $3 "% < " min "%"; bad = 1 } }
              END { exit bad }
            '
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-go
          path: ${{ inputs.working-dir }}/coverage.out
          if-no-files-found: ignore

  rust:
    name: rust
    if: ${{ inputs.language == 'rust' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: cargo fetch
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: cargo test
      - name: install coverage tool
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: cargo llvm-cov --fail-under-lines "$COVERAGE_FAIL_UNDER"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-rust
          path: ${{ inputs.working-dir }}/coverage.out
          if-no-files-found: ignore

  # -------------------------------------------------------- interpreted
  ruby:
    name: ruby
    if: ${{ inputs.language == 'ruby' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads .ruby-version/.tool-versions/mise.toml from working-dir when the
      # repo pins one, so the worktree and CI agree on the interpreter.
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: ${{ inputs.working-dir }}
          bundler-cache: true
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: bundle install
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: bundle exec rubocop --parallel
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: bundle exec rake
      # The repo's own `rake coverage` task reads COVERAGE_FAIL_UNDER and exits
      # nonzero below it (see README: a coverage rake task is part of adoption).
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: bundle exec rake coverage
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-ruby
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  elixir:
    name: elixir
    if: ${{ inputs.language == 'elixir' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(inputs.versions).elixir || '1.18' }}
          otp-version: ${{ fromJSON(inputs.versions).erlang || '27' }}
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: mix deps.get
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: mix format --check-formatted
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: mix test
      # coveralls is a hex dep the service repo declares; it exits nonzero
      # below the minimum, which is what makes this a gate and not a report.
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: mix coveralls --minimum-coverage "$COVERAGE_FAIL_UNDER"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-elixir
          path: ${{ inputs.working-dir }}/cover
          if-no-files-found: ignore

  python:
    name: python
    if: ${{ inputs.language == 'python' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: ${{ inputs.working-dir }}
          enable-cache: true
      # Only for the documented no-uv fallback; uv does not need it.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ fromJSON(inputs.versions).python || '3.13' }}
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: |
          if command -v uv >/dev/null 2>&1; then uv sync --frozen; else pip install -e '.[dev]'; fi
      - name: lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: ${{ inputs.working-dir }}
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run pytest --cov --cov-report=xml
          else
            pytest --cov --cov-report=xml
          fi
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: |
          if command -v uv >/dev/null 2>&1; then uv run coverage report --fail-under="$COVERAGE_FAIL_UNDER"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-python
          path: ${{ inputs.working-dir }}/coverage.xml
          if-no-files-found: ignore

  node:
    name: node
    if: ${{ inputs.language == 'node' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(inputs.versions).node || '22' }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-dir }}/package-lock.json
      - name: install
        working-directory: ${{ inputs.working-dir }}
        run: npm ci
      - name: lint
        working-directory: ${{ inputs.working-dir }}
        run: npm run lint
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: npm test
      # --if-present keeps day-one adoption green; drop it once the script exists
      # so a missing coverage step fails the build.
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: npm run coverage --if-present
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-node
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  # ------------------------------------------------------------------- bun
  # The job guard's own CI hand-rolled, because kit had none. guard ships
  # bun.lock and no package-lock.json, so the `node` job above would have died
  # on `npm ci` on day one and the whole file would have stayed bespoke.
  #
  # It is a separate job rather than a flag on the node one because the two
  # differ in ways a flag hides: a different package manager, a different
  # lockfile name, and a different frozen-install contract.
  bun:
    name: bun
    if: ${{ inputs.language == 'bun' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ fromJSON(inputs.versions).bun || '1.3.12' }}
      - name: install
        working-directory: ${{ inputs.working-dir }}
        # Frozen: installs exactly bun.lock and FAILS when the lock and the
        # manifest disagree. Plain `bun install` here would let a lockfile drift
        # reach master unnoticed, which is the entire reason the lockfile exists.
        run: bun install --frozen-lockfile
      - name: typecheck
        # `tsc --noEmit`. --noEmit matters: without it this step publishes
        # .js files next to the .ts sources, and the next step then tests files
        # the compiler invented rather than the ones in the commit.
        working-directory: ${{ inputs.working-dir }}
        run: bun run typecheck
      - name: test
        working-directory: ${{ inputs.working-dir }}
        run: bun test
      # --if-present for the same reason as the node job above: day-one adoption
      # must not be blocked by a coverage script that does not exist yet. Drop
      # it once `coverage` is in package.json, or this step is a report.
      - name: coverage
        working-directory: ${{ inputs.working-dir }}
        run: bun run --if-present coverage
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage-bun
          path: ${{ inputs.working-dir }}/coverage
          if-no-files-found: ignore

  # ----------------------------------------------------------------- telemetry
  # Opt-in (see the `telemetry` input). A repo that has copied
  # templates/otel/<lang>/ into its tree runs the W3C traceparent conformance
  # suite for its language on every push, so "we propagate traces" stops being a
  # claim in a README and becomes a red build.
  #
  # A matrix, not six jobs: this is the one place a matrix is right. It runs
  # only when a repo opts in, it is a small stdlib-only suite, and a per-language
  # job here would mean six near-identical blocks to keep in sync. The six
  # language jobs above stay ungated-by-matrix because each one installs a
  # different toolchain, which is the thing a matrix cannot share.
  telemetry:
    name: telemetry (${{ matrix.language }})
    if: ${{ inputs.telemetry == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      # One language at a time. Six runners for six stdlib suites costs more
      # than it returns, and a failure is easier to read from a serial log.
      max-parallel: 2
      fail-fast: false
      matrix:
        language:
          - go
          - ruby
          - elixir
          - python
          - node
          - rust
    steps:
      - uses: actions/checkout@v7
      # The toolchain comes from the matrix, so a bun-only repo does not install
      # an entire Go toolchain to run one test file. Each entry is the setup
      # action the language's own job uses, deliberately the same action and the
      # same version default, so the two paths cannot drift.
      - name: install go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ fromJSON(inputs.versions).go || 'stable' }}
      - name: install ruby
        if: ${{ matrix.language == 'ruby' }}
        uses: ruby/setup-ruby@v1
      - name: install elixir
        if: ${{ matrix.language == 'elixir' }}
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ fromJSON(inputs.versions).elixir || '1.18' }}
          otp-version: ${{ fromJSON(inputs.versions).erlang || '27' }}
      - name: install python
        if: ${{ matrix.language == 'python' }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ fromJSON(inputs.versions).python || '3.13' }}
      - name: install node
        if: ${{ matrix.language == 'node' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ fromJSON(inputs.versions).node || '22' }}
      - name: install rust
        if: ${{ matrix.language == 'rust' }}
        uses: dtolnay/rust-toolchain@stable
      - name: conformance suite
        # The suite the repo copied, not the one in kit: a service that has
        # patched its own middleware runs its own tests. Falls back to kit's
        # copy when the repo has not adopted the template yet, so turning the
        # input on is never a red build for want of a file.
        working-directory: ${{ inputs.working-dir }}
        env:
          KIT_TELEMETRY_DIR: ${{ inputs.working-dir }}/templates/otel/${{ matrix.language }}
        run: |
          set -euo pipefail
          dir="$KIT_TELEMETRY_DIR"
          if [ ! -d "$dir" ]; then
            echo "::notice::no $dir in this repo; running kit's own copy of the suite"
            dir="${GITHUB_ACTION_PATH}/templates/otel/${KIT_TELEMETRY_LANG:-${{ matrix.language }}}"
          fi
          case "${{ matrix.language }}" in
            go)
              GOFLAGS=-mod=mod GOPROXY=off GOTOOLCHAIN=local go test "$dir/..." ;;
            ruby)
              ruby "$dir/test_traceparent.rb" ;;
            elixir)
              elixir -r "$dir/traceparent.ex" "$dir/test_traceparent.exs" ;;
            python)
              python3 "$dir/test_traceparent.py" ;;
            node)
              node --test "$dir/traceparent.test.mjs" ;;
            rust)
              rustc --test --edition 2021 -o "$RUNNER_TEMP/kit-telemetry" "$dir/traceparent.rs"
              "$RUNNER_TEMP/kit-telemetry" ;;
          esac
