---
# hadolint config for every cafaye repo that ships a Dockerfile.
#   hadolint -c .hadolint.yaml .
#
# kit lints its own seven Dockerfiles with this file (see tests/validate.sh), so
# a rule relaxed here is relaxed deliberately and in one place, not per-Dockerfile.
#
# STRICTNESS NOTES
#   - failure-threshold is `warning`, not hadolint's default `info`. The `info`
#     tier is advisory style (shell-form pipelines, non-numeric users) and
#     failing a build on it produces a gate people learn to run with --no-fail.
#     Everything hadolint calls a warning or an error still fails.
#   - The one rule we ignore is DL3008, and the reason is a repo-level decision
#     rather than a per-file shrug: see `ignored` below. Every other rule
#     stands. If you find yourself adding a second one, the question to answer
#     first is whether the rule or the template is wrong.
failure-threshold: warning

ignored:
  # DL3008 — "pin versions in apt-get install".
  #
  # Deliberately ignored, and this is the interesting one. kit's Dockerfiles
  # are TEMPLATES: thirteen repos copy them and raise the versions in their own
  # tree. A hardcoded `build-essential=12.9` here would be a version thirteen
  # repositories have to remember to bump in thirteen places, and the day the
  # Debian archive drops that exact version every one of them fails to build at
  # once — a coordinated outage caused by a security patch landing.
  #
  # The base image tag is already the pin (`python:${PYTHON_VERSION}-slim`), and
  # apt's own security updates are the mechanism for patching what it installs.
  # Pinning a package version inside a template trades a routine patch for a
  # correlated build failure.
  #
  # A service that wants reproducible apt resolution should pin in ITS repo,
  # where one person owns one file — which is the whole "callers override,
  # they never fork" rule.
  - DL3008
