# kit — the cafaye secret-scanner allowlist, and nothing else.
#
# WHY A CONFIG AT ALL
#   `gitleaks detect` finds gitleaks' DEFAULT rules with no config file. This
#   file exists to do two things and no others:
#
#     1. keep the rules themselves gitleaks' own, forever, by extending the
#        default config rather than copying it. A vendored copy of ~150 rules is
#        a copy that stops receiving new providers, and a secret scanner whose
#        rules stopped growing is a scanner that has stopped working.
#     2. carry the allowlist — the only thing cafaye has ever had to excuse —
#        in one committed place, where it can be reviewed and pruned.
#
#   There are deliberately NO `[[rules]]` blocks here. A repo that redefines a
#   rule has taken responsibility for the regex, and `tests/validate.sh` fails
#   the build if one appears. That check is what stops "just this one rule is
#   wrong" from becoming a quiet, unlogged local override.
#
# WHY NO `-i` FLAGS IN THE COMMAND LINE
#   gitleaks also accepts an inline allowlist. An inline allowlist lives in
#   whatever shell ran the scan, so it is invisible in review, unversioned, and
#   gone the next time someone runs the scanner by hand. R3 says the allowlist
#   is this file, and the check that says so is load-bearing.
#
# EVERY ENTRY CARRIES A REASON, AND ONE WITHOUT A REASON FAILS THE GATE
#   This is the ESLint `reportUnusedDisableDirectives` property, and it is the
#   load-bearing one: an allowlist that grows monotonically and is never pruned
#   is not an allowlist, it is a deferred disclosure. `description` is
#   gitleaks' own field for exactly this, so a reason cannot be forgotten —
#   omitting it is a schema error, and a vague one is caught by the gate's
#   minimum-length check.
#
#   An allowlist entry is a decision to accept that a scanner will keep
#   reporting something. The decision needs a name on it, or the next person to
#   read this file cannot tell an accepted false positive from an accepted
#   secret.
#
# THE ENTRIES
#   There is exactly one, and it is the narrowest thing the config format
#   allows. kit's own history scans clean apart from it (verified with these
#   rules), and the canary harness deliberately never commits a
#   credential-shaped string — the fake credential is BUILT at run time from a
#   prefix, precisely so that it needs no allowlist entry here.
#
#   What forced the first entry is the same principle arriving from outside:
#   kit-16's deploy story proves its redactor catches a JWT **by shape** — a
#   value the redactor cannot know by name, which is the only kind of canary
#   that can fail. To assert that, the token has to exist in the test file, and
#   a JWT-shaped string committed to a repository IS a gitleaks finding. So the
#   fixture is real, the finding is real, and the two facts are reconciled here
#   rather than by weakening the scanner or by weakening the test.
#
#   An adopting service will have entries. The check that requires a reason per
#   entry ships in tests/validate.sh, which is the file a service copies, so the
#   rule arrives with the first entry rather than with the second.

title = "cafaye — kit's allowlist, on gitleaks' default rules"

# The config format below is not backported. A gitleaks older than this parses
# what it recognises and silently ignores the rest, which is the failure mode a
# minimum version exists to prevent.
minVersion = "v8.25.0"

[extend]
# `useDefault` is the whole reason this file can be thirty lines instead of six
# thousand. gitleaks merges its own rules underneath whatever we declare, so a
# new provider detection ships to thirteen repos the day gitleaks ships it.
useDefault = true

# `[[allowlists]]` entries go here, one per accepted finding, each with a
# `description` that says what is allowed and why. The shape gitleaks accepts:
#
#   [[allowlists]]
#   description = "why this is a false positive, in one sentence"
#   paths = ['''^fixtures/known-fake-credentials\.txt$''']
#
# `condition = "AND"` is written out rather than left to the default, and the
# reason is a trap worth naming: gitleaks' default is **OR**
# (`config/allowlist.go` — an empty `condition` parses to `AllowlistMatchOr`).
# With only `paths` populated, OR and AND happen to agree — there is no second
# criterion for OR to escape through — so the line below is currently doing
# nothing at all. It is there so that the day somebody adds `regexes` or
# `commits` to this entry, the entry cannot silently become a union and excuse
# more than it says. A scoping line that only works while nobody edits it is not
# a scoping line.

[[allowlists]]
# WHAT THIS ACCEPTS, EXACTLY: the `jwt` rule's finding on the file
# `tests/deploy_test.sh`. Nothing else.
#
#   - `targetRules = ["jwt"]` — one rule, gitleaks' own, unmodified. This is
#     routing, not a criterion: it decides which rules consult this allowlist at
#     all. Every other rule still fires on that file — a `generic-api-key`
#     planted in `tests/deploy_test.sh` is still reported with this entry in
#     place (verified in a throwaway repository, both directions). And
#     `targetRules` on its own is not available as a looser option: gitleaks
#     rejects an entry with no `commits`/`paths`/`regexes`/`stopwords` outright
#     (verified — it refuses to load the config), so a bare "ignore jwt
#     everywhere" is not something this file can say even by accident.
#   - `paths` — the one path kit-16's redactor proof lives at, which is the only
#     criterion this entry actually has. The same JWT-shaped string in any other
#     file is still reported (verified the same way), which is the property that
#     makes this an allowlist rather than a blanket.
#   - `condition = "AND"` — inert today, and deliberately so; see the note above
#     this entry.
#
# WHY IT IS NOT A SECRET. `JWT_CANARY` in `tests/deploy_test.sh` is a fixture
# whose three base64url segments decode, in full, to: `{"alg":"HS256"}`,
# `{"sub":"kit16"}`, and the signature `CYNaRYLFAKRESULTTESQL` plus one stray
# non-printable byte. That third segment is a misspelled reading of "canary,
# fake" and nothing else — there is no key, no issuer, no subject a token could
# authenticate. It was planted by kit-16, and the scanner caught it working
# exactly as intended: this rule fires on any three-segment `eyJ…` string it was
# never told about, in a commit (`924b725`) whose own message records that the
# work was recovered from a killed process. The finding is the scanner being
# right about the SHAPE. And the name is load-bearing in the other direction:
# `JWT_CANARY` as a variable name is what tells the next reader this string is
# a fixture rather than a leak.
#
# WHAT WOULD MAKE THIS ENTRY WRONG, AND HOW IT WAS CHECKED. Allowlisting a
# canary is only honest if the canary still proves what it proved. The
# redactor's JWT pattern was broken in a scratch copy
# (`eyJ…\.[A-Za-z0-9_-]{4,}` → `{99,}`, so it cannot match an ordinary
# signature) and `tests/deploy_test.sh` went red on exactly one line — "the
# redactor left a JWT in the output" — with its other 16 claims still green.
# The assertion is load-bearing after this entry, not merely present. Reverted,
# and the scratch copy matches the branch byte for byte.
#
# THE ALTERNATIVE, RECORDED BECAUSE IT WAS THE OBVIOUS ONE. kit-16 could make
# the canary not JWT-shaped — build it at run time from a prefix, the way
# `templates/secrets/` already does. That is a strictly better answer and it is
# kit-16's call, not this packet's: that branch is not merged here, and an
# allowlist entry that stops matching when the fix lands is the correct thing to
# leave behind in the meantime. If the entry ever matches nothing, that is the
# signal it is stale — delete it, do not leave it decaying.
#
# AND WHAT A SERVICE THAT COPIES THIS FILE INHERITS. This file is copied verbatim
# into thirteen repositories, and the entry below names `tests/deploy_test.sh`,
# which none of them has. A `paths` allowlist that matches nothing excuses
# nothing — the scan is unaffected — but it is a line in a security config that
# explains itself in terms of a repository it is not in, and an entry whose reason
# is only true of the file it came from is how the next reader learns that
# descriptions are optional in practice. **A service that copies this file should
# delete the entry below, and add its own when it has a reason.** gitleaks cannot
# report a dead allowlist entry the way `templates/tier/skip-allowlist`'s hygiene
# rules report a dead one there, so the obligation is the reader's; saying so is
# the only place it can be said.
description = "the jwt rule on tests/deploy_test.sh only: kit-16's JWT_CANARY is a deliberate fixture proving the deploy redactor catches JWT-shaped input it was never told about, so the finding is the scanner working"
condition = "AND"
targetRules = ["jwt"]
# THE PATH IS MATCHED AGAINST WHAT gitleaks CALLS THE FILE, AND THAT IS NOT THE
# SAME STRING IN BOTH SCAN MODES. A history scan reports paths relative to the
# repository root; a `--no-git` directory scan — which is the mode
# `tests/gitleaks_gate.sh` selects for a throwaway copy, and this file has been
# scanned that way by every one of self_test.sh's copies — reports the ABSOLUTE
# path. Anchored at `^tests/`, the entry matched the first and not the second,
# so the copy's scan exited 1 and the self-test control read "the gate is RED on
# an unbroken tree" for a reason that had nothing to do with the tree.
#
# Both are matched rather than one, because the alternative is an allowlist that
# is only true in the mode its author happened to run: an entry that stops
# applying the moment the scan moves is an entry that is a default, and the
# comment three entries above this one explains exactly why a redaction rule that
# can be taught nothing must not be one of them.
paths = ['''(^|.*/)tests/deploy_test\.sh$''']
