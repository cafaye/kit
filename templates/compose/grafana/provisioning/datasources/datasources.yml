---
# kit template — Grafana datasources, provisioned on first load.
#
# WHY THIS IS A FILE AND NOT A CLICK
#   "A dashboard a self-hoster has to rebuild is not a dashboard we shipped"
#   (PLAN.md §7b). Provisioned as files means `bin/dev up` produces a working
#   observability stack with nothing configured, and means the datasource UIDs
#   are stable — the dashboards reference them by UID, so renaming a datasource
#   in the UI cannot silently break a provisioned panel.
#
# THE THREE LAYERS OF §7b, IN ORDER
#   tempo  traces        the redaction boundary's first stop
#   loki   logs          the crash layer: every container's stderr, no SDK
#   mimir  metrics       what spanmetrics derived from already-redacted spans
#
# `uid` is what makes the difference. The dashboards below name `uid: tempo`
# etc., so provisioning order does not matter and a rename in the UI is not a
# broken dashboard.

apiVersion: 1

datasources:
  # ------------------------------------------------------------------- traces
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      # The stream of every trace, on the default traces-to-logs time range, so
      # clicking through from a trace to its logs needs no configuration.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        filterBySpanID: false
        tags:
          # Only these become search tags. core's log schema allows three
          # attributes; a log store where every attribute is a label is a log
          # store that runs out of streams, which is the reason core's log
          # schema caps the attribute count at twelve.
          - key: service.name
            value: service_name
          - key: error.type
            value: error_type
      # The reverse direction, and the one that makes an error in a log
      # traceable to the request that caused it.
      nodeGraph:
        enabled: true
      search:
        hide: false
      # The documented error workflow: filter on span STATUS, then break the
      # result down. `error.type` is the drill-down inside a service, never the
      # predicate — see the dashboard's own header comment.
      serviceMap:
        datasourceUid: mimir
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service_name
      metrics:
        datasourceUid: mimir

  # --------------------------------------------------------------------- logs
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      # Lines, not traces: a crash is a log record, and `spanId` is on a span.
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo

  # ------------------------------------------------------------------ metrics
  - name: Mimir
    uid: mimir
    type: prometheus
    access: proxy
    # 8080, the gateway. Measured against grafana/mimir:2.13.0 in
    # `-target=all`: 9009 is not listening on that build, and `/ready` and
    # `/prometheus/api/v1` are both on 8080. A datasource pointed at 9009
    # looks configured in the UI and returns "connection refused" on every
    # panel, which is the most confusing possible failure.
    url: http://mimir:8080/prometheus
    isDefault: true
    editable: false
    # The tenant, in the same place Grafana keeps header values. `secureJsonData`
    # is not a claim of secrecy here — the value is a fixed string in this
    # template — it is where Grafana reads a provisioned header VALUE from, and
    # a datasource with `httpHeaderName1` and no value sends the header empty,
    # which Mimir treats as no tenant at all.
    secureJsonData:
      httpHeaderValue1: single-tenant
    # Tempo's traceQL metrics and Mimir's PromQL are different query languages
    # against the same data. They are kept apart on purpose: a panel that mixes
    # them has no way to say which one produced a number, and the two do not
    # always agree at the boundary.
    jsonData:
      # Mimir is multi-tenant and answers `no org id` to a query with no tenant
      # — verified, not assumed. The header name and value are the same tenant
      # the collector writes with (KIT_MIMIR_TENANT); a mismatch is a write that
      # lands and a query that cannot see it, which is worse than either side
      # failing loudly.
      httpHeaderName1: X-Scope-OrgID
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
      httpMethod: POST
      # The spanmetrics connector is CUMULATIVE, and Grafana's rate() is written
      # for a counter. Declaring the flavour stops a future reader from adding
      # `rate()` where a bare value is already right.
      prometheusType: Prometheus
      prometheusVersion: 2.54.0
